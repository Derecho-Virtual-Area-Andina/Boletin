<!doctype html>
<html lang="es">
<head>

<style>
:root { color-scheme:dark; --verde:#8bc53f; --fucsia:#e50084; }
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:#121712; color:#fff; font-family:Arial,Helvetica,sans-serif; }
.pieza { max-width:941px; margin:auto; background:#000; box-shadow:0 14px 65px #0006; }
.grafico { display:block; width:100%; height:auto; }
.hero { position:relative; width:100%; aspect-ratio:941/680; overflow:hidden; background:#0b1412; isolation:isolate; container-type:inline-size; }
.hero::before { content:""; position:absolute; inset:-22px; background:url("assets/poster_del_video.jpg") center / cover no-repeat; filter:blur(27px) brightness(.48); transform:scale(1.09); z-index:-2; }
.hero::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(90deg,#04090850 0%,transparent 40%,transparent 65%,#04090850 100%),linear-gradient(0deg,#000e 0%,#0004 20%,transparent 43%,transparent 70%,#0005 100%); z-index:1; }
.hero video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; background:transparent; z-index:0; }
.hero .label { position:absolute; z-index:2; margin:0; color:#fff; font-weight:800; text-transform:uppercase; text-shadow:0 2px 13px #000a; pointer-events:none; }
.etiqueta-superior { top:8.8%; left:10.1%; font-size:2.55cqw; line-height:1.11; letter-spacing:.012em; }
.barra-izquierda { position:absolute; z-index:2; top:8.3%; left:6.35%; width:1.48%; height:13.4%; background:var(--verde); }
.barra-arriba { position:absolute; z-index:2; top:0; right:10.2%; width:10.9%; height:2.2%; background:var(--verde); }
.barra-magenta { position:absolute; z-index:2; right:7.7%; top:0; width:2.35%; height:25%; background:var(--fucsia); }
.pie-hero { position:absolute; z-index:2; bottom:2.4%; left:6.2%; display:flex; align-items:center; gap:1.95cqw; text-shadow:0 2px 9px #000c; pointer-events:none; }
.pie-hero .ciudad { font-size:3.25cqw; font-weight:900; line-height:1; }
.pie-hero .sep { background:var(--verde); width:.35cqw; height:3.3cqw; }
.pie-hero .encuentro { color:var(--verde); font-size:3.07cqw; font-weight:800; line-height:1; white-space:nowrap; }
.barra-naranja { position:absolute; z-index:2; bottom:0; left:0; width:21%; height:1.35%; background:#f3ad37; }
.derecho { position:absolute; z-index:2; right:3.45%; bottom:2.7%; color:#fff; font-size:5.05cqw; font-weight:900; line-height:.78; letter-spacing:-.055em; text-align:right; text-shadow:0 2px 9px #000a; pointer-events:none; }
.informacion { position:relative; }
.enlace-inscripcion { position:absolute; left:6%; top:72.1%; width:86.7%; height:19%; display:block; border-radius:12px; }
.enlace-inscripcion:focus-visible { outline:4px solid white; outline-offset:3px; }
.screenreader { position:absolute; height:1px; width:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
@media(max-width:600px){ .pieza {box-shadow:none} .hero::before{filter:blur(11px) brightness(.5)} .enlace-inscripcion{border-radius:6px} }
</style>
</head>
<body>
<main class="pieza" aria-label="Invitación al encuentro presencial 2026 de Derecho Virtual Areandina">
<h1 class="screenreader">Reunámonos para integrarnos y compartir · Derecho Virtual Areandina</h1>
<img class="grafico" src="assets/cabecera_areandina.png" width="941" height="159" alt="AREANDINA, Fundación Universitaria del Área Andina. Sede Pereira.">
<section class="hero" aria-label="Video de invitación al encuentro presencial en Pereira">
<video controls autoplay muted loop playsinline preload="metadata" poster="assets/poster_del_video.jpg" aria-label="Video del encuentro de Derecho Virtual Areandina, 22 segundos. Usa los controles para activar el sonido.">
<source src="assets/video_encuentro.mp4" type="video/mp4">Tu navegador no admite videos HTML5.
</video>
<div class="barra-izquierda" aria-hidden="true"></div>
<div class="barra-arriba" aria-hidden="true"></div>
<div class="barra-magenta" aria-hidden="true"></div>
<p class="label etiqueta-superior">INVITACIÓN PARA<br>ESTUDIANTES Y<br>PROFESORES</p>
<div class="pie-hero" aria-hidden="true"><span class="ciudad">PEREIRA</span><span class="sep"></span><span class="encuentro">ENCUENTRO PRESENCIAL</span></div>
<div class="derecho" aria-hidden="true">DERECHO<br>VIRTUAL</div>
<div class="barra-naranja" aria-hidden="true"></div>
</section>

<img class="grafico" src="assets/informacion_original.png" width="941" height="833" alt="Reunámonos para integrarnos y compartir. Te invitamos al encuentro presencial 2026 de Derecho Virtual Areandina, un espacio para fortalecer la integración, compartir y encontrarnos en el corazón del Eje Cafetero. Porque en Derecho Virtual la integración es Solidaridad. Viernes 13 de noviembre de 2026, de 9:00 a. m. a 1:00 p. m., Auditorio Principal, Seccional Pereira, Fundación Universitaria del Área Andina. Confirma tu asistencia.">
<a class="enlace-inscripcion" href="https://forms.gle/tA2U6cNktdg2MQ7L7" target="_blank" rel="noopener noreferrer" aria-label="CONFIRMA TU ASISTENCIA. Abrir formulario de inscripción al encuentro presencial de Derecho Virtual."></a>
</div>
</main>

</html>
